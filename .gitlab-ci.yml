#   artifacts:
#     paths:
#       - build/reports/jacoco/
#     expire_in: 30 days
#   dependencies:
#     - build

# ============================================================================
# Success and Failure Notifications
# ============================================================================
success:
  stage: .post
  script:
    - echo "CI/CD Pipeline completed successfully!"
  when: on_success
  only:
    - main
    - develop

failure:
  stage: .post
  script:
    - echo "CI/CD Pipeline failed. Please check the logs above."
  when: on_failure
  only:
    - main
    - develop
